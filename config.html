<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Configurador de Grupos</title>
  <style>
    body { font-family: Arial, sans-serif; background:#1e1e1e; color:#eee; padding:20px; }
    h1 { color:#fff; }
    .barra { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:15px; }
    .barra label { margin:0; }
    .grupo { background:#2a2a2a; border:1px solid #444; border-radius:8px; padding:15px; margin-bottom:15px; }
    .grupo h3 { margin-top:0; color:#4fc3f7; }
    label { display:inline-block; margin:5px 10px 5px 0; }
    input { background:#1a1a1a; color:#fff; border:1px solid #555; border-radius:4px; padding:5px; width:90px; }
    input.demora { width:220px; }
    input.ruta { width:180px; }
    button { background:#4fc3f7; color:#111; border:none; padding:10px 20px; border-radius:6px; cursor:pointer; font-weight:bold; }
    button:hover { background:#29b6f6; }
    button.peligro { background:#e57373; }
    button.peligro:hover { background:#ef5350; }
    button:disabled { opacity:.5; cursor:wait; }
    #status { margin-top:15px; color:#81c784; white-space:pre-wrap; }
    .error { color:#e57373 !important; }
    .limpieza { margin-top:30px; padding-top:15px; border-top:1px solid #444; }
  </style>
</head>
<body>

  <h1>Configurador de Grupos</h1>

  <div class="barra">
    <label>Número de grupos:
      <input type="number" id="numGrupos" min="1" max="10" value="7">
    </label>
    <button id="btnCargar">Cargar configuración actual</button>
    <button id="btnGuardar">Guardar en Firebase</button>
  </div>

  <div id="gruposContainer"></div>

  <div class="limpieza">
    <h3>Mantenimiento de usuarios</h3>
    <label>Ruta de usuarios en Firebase:
      <input type="text" id="rutaUsuarios" class="ruta" value="participantes">
    </label>
    <button id="btnLimpiar" class="peligro">Limpiar usuarios con un solo elemento</button>
  </div>

  <div id="status"></div>

  <script type="module">
    import { ref, get, update } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

    const MAX_GRUPOS = 10;
    const $ = id => document.getElementById(id);
    const cont = $('gruposContainer');
    const status = $('status');

    function setStatus(msg, esError = false) {
      status.textContent = msg;
      status.className = esError ? 'error' : '';
    }

    // ---------- Carga de tu firebase-init.js (sin modificarlo) ----------
    let db = null, auth = null;
    try {
      const init = await import("./firebase-init.js");
      db = init.db;
      auth = init.auth;
    } catch (e) {
      console.error(e);
      setStatus(
        '❌ No se pudo cargar firebase-init.js: ' + e.message + '\n\n' +
        'Si abriste esta página con doble clic (file://), el navegador bloquea los módulos.\n' +
        'Ábrela desde un servidor local, por ejemplo:\n' +
        '  1) Abre una terminal en esta carpeta\n' +
        '  2) Ejecuta:  py -m http.server 8000\n' +
        '  3) Entra a:  http://localhost:8000/config.html', true);
    }

    // Espera a que el login anónimo termine (máx. 5 s)
    function esperarAuth() {
      return new Promise(resolve => {
        if (!auth || auth.currentUser) return resolve();
        const t = setTimeout(resolve, 5000);
        const un = onAuthStateChanged(auth, u => {
          if (u) { clearTimeout(t); un(); resolve(); }
        });
      });
    }

    function requiereDb() {
      if (!db) { setStatus('❌ Firebase no está inicializado (revisa el mensaje de arriba).', true); return false; }
      return true;
    }

    // ---------- Grupos (se agregan/quitan sin regenerar los demás) ----------
    function crearGrupo(i) {
      const div = document.createElement('div');
      div.className = 'grupo';
      div.dataset.i = i;
      div.innerHTML = `
        <h3>Grupo C${i}</h3>
        <label>HUMAN_WIN_RANGE: <input type="number" id="C${i}_HWR" value="50"></label>
        <label>HUMANDIE: <input type="number" id="C${i}_HD" value="500"></label>
        <label>MACHINE_WIN_RANGE: <input type="number" id="C${i}_MWR" value="50"></label>
        <label>MACHINEDIE: <input type="number" id="C${i}_MD" value="500"></label>
        <br>
        <label>DEMORA (números separados por coma):
          <input type="text" class="demora" id="C${i}_DEMORA" value="0" placeholder="ej: 0, 100, 200">
        </label>
        <br>
        <label>falsos_positivos: <input type="number" id="C${i}_FP" value="0"></label>
        <label>iniciados: <input type="number" id="C${i}_IN" value="0"></label>
      `;
      return div;
    }

    function ajustarGrupos(n) {
      n = Math.max(1, Math.min(MAX_GRUPOS, n));
      let actual = cont.querySelectorAll('.grupo').length;
      while (actual < n) { cont.appendChild(crearGrupo(++actual)); }
      while (actual > n) { cont.lastElementChild.remove(); actual--; }
      $('numGrupos').value = n;
    }

    $('numGrupos').addEventListener('input', e => {
      const n = parseInt(e.target.value);
      if (!isNaN(n)) ajustarGrupos(n);
    });

    // ---------- Cargar configuración ----------
    $('btnCargar').addEventListener('click', async () => {
      if (!requiereDb()) return;
      setStatus('Cargando...');
      try {
        await esperarAuth();
        const snapshot = await get(ref(db, 'Configuración'));
        if (!snapshot.exists()) { setStatus('No hay configuración guardada aún.'); return; }

        const data = snapshot.val();
        const grupos = Object.keys(data).filter(k => /^C\d+$/.test(k));
        if (!grupos.length) { setStatus('No hay grupos en la configuración.'); return; }

        const maxIdx = Math.max(...grupos.map(g => parseInt(g.slice(1))));
        ajustarGrupos(maxIdx);

        for (const g of grupos) {
          const i = g.slice(1);
          const c = data[g];
          if (!$(`C${i}_HWR`)) continue;
          $(`C${i}_HWR`).value = c.HUMAN_WIN_RANGE ?? 0;
          $(`C${i}_HD`).value = c.HUMANDIE ?? 0;
          $(`C${i}_MWR`).value = c.MACHINE_WIN_RANGE ?? 0;
          $(`C${i}_MD`).value = c.MACHINEDIE ?? 0;
          $(`C${i}_DEMORA`).value = Array.isArray(c.DEMORA) ? c.DEMORA.join(', ') : (c.DEMORA ?? 0);
          $(`C${i}_FP`).value = c.falsos_positivos ?? 0;
          $(`C${i}_IN`).value = c.iniciados ?? 0;
        }
        setStatus('✅ Configuración cargada en el formulario.');
      } catch (e) {
        console.error(e);
        setStatus('❌ Error al cargar: ' + e.message, true);
      }
    });

    // ---------- Guardar configuración ----------
    // update() solo sobre "Configuración": escribe los grupos, borra los que sobran
    // y NO toca "select" ni nada fuera de "Configuración" (participantes incluidos).
    $('btnGuardar').addEventListener('click', async () => {
      if (!requiereDb()) return;
      setStatus('Guardando...');
      try {
        await esperarAuth();
        const n = parseInt($('numGrupos').value);
        const cambios = {};

        for (let i = 1; i <= n; i++) {
          const demoraStr = $(`C${i}_DEMORA`).value.trim();
          const demoraArr = demoraStr === ''
            ? []
            : demoraStr.split(',').map(x => Number(x.trim())).filter(x => !isNaN(x));

          cambios[`C${i}`] = {
            HUMAN_WIN_RANGE: Number($(`C${i}_HWR`).value),
            HUMANDIE: Number($(`C${i}_HD`).value),
            MACHINE_WIN_RANGE: Number($(`C${i}_MWR`).value),
            MACHINEDIE: Number($(`C${i}_MD`).value),
            DEMORA: demoraArr,
            falsos_positivos: Number($(`C${i}_FP`).value),
            iniciados: Number($(`C${i}_IN`).value)
          };
        }

        const snapshot = await get(ref(db, 'Configuración'));
        if (snapshot.exists()) {
          for (const k of Object.keys(snapshot.val())) {
            if (/^C\d+$/.test(k) && !(k in cambios)) cambios[k] = null;
          }
        }

        await update(ref(db, 'Configuración'), cambios);
        setStatus(`✅ Guardado correctamente (${n} grupos).`);
      } catch (e) {
        console.error(e);
        setStatus('❌ Error: ' + e.message, true);
      }
    });

    // ---------- Limpiar usuarios con un solo elemento ----------
    $('btnLimpiar').addEventListener('click', async () => {
      if (!requiereDb()) return;
      const ruta = $('rutaUsuarios').value.trim().replace(/^\/+|\/+$/g, '');
      if (!ruta) { setStatus('Indica la ruta de usuarios.', true); return; }

      const btn = $('btnLimpiar');
      btn.disabled = true;
      setStatus('Buscando usuarios con un solo elemento...');
      try {
        await esperarAuth();
        const snapshot = await get(ref(db, ruta));
        if (!snapshot.exists()) { setStatus(`No hay datos en "${ruta}".`); return; }

        const data = snapshot.val();
        const total = Object.keys(data).length;
        const aBorrar = Object.keys(data).filter(k => {
          const v = data[k];
          return v !== null && typeof v === 'object' && Object.keys(v).length === 1;
        });

        if (!aBorrar.length) {
          setStatus(`Revisados ${total} usuarios: ninguno tiene un solo elemento.`);
          return;
        }

        const muestra = aBorrar.slice(0, 15).join(', ') + (aBorrar.length > 15 ? ', …' : '');
        if (!confirm(`Se eliminarán ${aBorrar.length} de ${total} usuarios en "${ruta}" que solo tienen un elemento:\n\n${muestra}\n\nEsta acción no se puede deshacer. ¿Continuar?`)) {
          setStatus('Limpieza cancelada.');
          return;
        }

        const cambios = {};
        aBorrar.forEach(k => cambios[k] = null);
        await update(ref(db, ruta), cambios);
        setStatus(`✅ Eliminados ${aBorrar.length} usuarios con un solo elemento (quedan ${total - aBorrar.length}).`);
      } catch (e) {
        console.error(e);
        setStatus('❌ Error al limpiar: ' + e.message, true);
      } finally {
        btn.disabled = false;
      }
    });

    // 7 grupos por defecto al abrir
    ajustarGrupos(7);
  </script>

</body>
</html>
